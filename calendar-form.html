---
layout: default
title: Calendar form
permalink: calendar/form
---

<div class="home">
	<div class="container-centered">
		<h3>Calendar Form</h3>
		<p>Add your league match to the <a href="/match-calendar">match calendar</a>.</p>
	</div>
	<div class="form-option">
		<span>Division:</span>
		<select id="division" class="text-display">
			<option value=""></option>
		</select>
	</div>
	<div class="form-option">
		<p>Your username</p>
		<select id="user1" name="Your username" class="text-display">
			<option value=""></option>
		</select>
	</div>
	<div class="form-option">
		<p>Your opponent's username</p>
		<select id="user2" name="Your opponent's username" class="text-display">
			<option value=""></option>
		</select>
	</div>
	<div class="form-option">
		<p>Date and Time</p>
		<div style="position:relative;top:-6px;">
			<label for="UTC" class="chartInput inline">
				<input type="radio" id="UTC" class="chartInput chartRadio" name="timezone" checked="checked"></input>
				<span>UTC</span>
			</label>
			<label for="localTime" class="chartInput inline">
				<input type="radio" id="localTime" class="chartInput chartRadio" name="timezone"></input>
				<span id="localTimeZone">Local Time</span>
			</label>
		</div>
		<input type="date" id="date" name="Date" class="text-display"></input>
		<span class="inline">at</span>
		<input type="text" id="hour" name="Hours" maxlength="2" inputmode="numeric" pattern="[0-9]*" novalidate class="slidertext text-display"></input>
		<span>:</span>
		<input type="text" id="minute" name="Minutes" maxlength="2" inputmode="numeric" pattern="[0-9]*" novalidate class="slidertext text-display"></input>
		<select id="ampm" class="text-display" style="display:none;">
			<option value="AM">AM</option>
			<option value="PM">PM</option>
		</select>
		<p id="time-verify" style="color:red;"></p>
	</div>
		<div class = "form-option">
		<label for="commentary" class="chartInput inline">
			<input type="checkbox" name="commentary" id="commentary" class="chartInput chartCheck">
			<span>Request commentary for this match</span>
		</label>
	</div>
	<div class="form-option">
		<div></div>
		<div id="pushout" class="form-button"><button>Add to Calendar</button></div>
		<div id="reschedule" class="form-button"><button>Reschedule Existing Match</button></div>
		<div id="remove" class="form-button"><button>Remove Match at Time Above</button></div>
		<p id="submit-verify" style="color:red;"></p>
	</div>
</div>
<script>
const divisions = {{ site.data.current_season | jsonify }};
const override = null;
const formURL = "https://docs.google.com/forms/d/e/1FAIpQLScw-U_gquzImZfwVoVmJVNbYr_oqK9gD9l2X11Hbf9J9lvuNw/formResponse?entry.1760809337=League";
const division = document.getElementById("division");
const user1 = document.getElementById("user1");
const user2 = document.getElementById("user2");
const date = document.getElementById("date");
const hours = document.getElementById("hour");
const minutes = document.getElementById("minute");
const ampm = document.getElementById("ampm");
ampm.value = "";
const localTime = document.getElementById("localTime");
const timeMessage = document.getElementById("time-verify");
const submitMessage = document.getElementById("submit-verify");
const matchTime = document.getElementById("match-time");
const commentary = document.getElementById("commentary");
const buttonText = {
	"pushout": "Add to Calendar",
	"reschedule": "Reschedule Existing Match",
	"remove": "Remove Match"
};
const rrEntry = {
	"pushout": "",
	"reschedule": "&entry.580511610=Replace",
	"remove": "&entry.580511610=Remove"
};
loadPage();

function loadPage() {
	var selectedDiv = "";
	if (window.location.search) {
		let params = new URLSearchParams(window.location.search);
		if (params.has("div")) {
			selectedDiv = params.get("div").toUpperCase();;
		}
	}
	
	if (override) {
		for (div in override) {
			let opt = document.createElement("option");
			opt.value = div;
			if (div == selectedDiv) {
				opt.selected = true;
			}
			opt.appendChild(document.createTextNode(div));
			division.appendChild(opt);
		}
	} else {
		for (div in divisions) {
			if (/^[A-Z]\d+$/.test(div)) {
				let opt = document.createElement("option");
				opt.value = div;
				if (div == selectedDiv) {
					opt.selected = true;
				}
				opt.appendChild(document.createTextNode(div));
				division.appendChild(opt);
			}
		}
	}
	
	division.addEventListener('change', function(ev) {
		updatePlayers(ev.target.value);
	});
	
	if (selectedDiv in divisions) {updatePlayers(selectedDiv);}
	
	user1.addEventListener('change', function(ev) {
		updateUrl();
	});
	
	user2.addEventListener('change', function(ev) {
		updateUrl();
	});
	
	let tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
	let utcOffset = (new Date()).getTimezoneOffset();
	let offsetHours = String(Math.floor(Math.abs(utcOffset)/60));
	let offsetMinutes = String(Math.abs(utcOffset)%60);
	
	document.getElementById("localTimeZone").innerHTML = "Local Time (" + tz + ", currently UTC" + (utcOffset > 0 ? "\u2212" : "+") + offsetHours + ":" + "0".repeat(2-offsetMinutes.length) + offsetMinutes +")";
	
	date.oninput = updateUrl;
	date.onblur = updateUrl;
	
	hours.onInput = updateUrl;
	hours.onblur = function() {
		var hourInput = Number(hours.value);
		if (isNaN(hourInput) || hourInput < 0 || hourInput > 23 || hourInput % 1 || (ampm.value == "PM" && hourInput > 12)) {
			timeMessage.innerHTML = "Hours should be an integer between 0 and " + (ampm.value == "PM" ? "12" : "23");
			hours.value = "";
		} else {
			timeMessage.innerHTML = "";
		}
		updateUrl();
	};
	minutes.onInput = updateUrl;
	minutes.onblur = function() {
		var minuteInput = Number(minutes.value);
		if (isNaN(minuteInput) || minuteInput < 0 || minuteInput > 59 || minuteInput % 1) {
			timeMessage.innerHTML = "Minutes should be an integer between 0 and 59";
			minutes.value = "";
		} else {
			timeMessage.innerHTML = "";
		}
		updateUrl();
	};
	
	document.getElementById("UTC").onclick = function() {
		ampm.style.display = "none";
		ampm.value = "";
		updateUrl();
	}
	
	localTime.onclick = function() {
		if (/[AP]M/i.test((new Date()).toLocaleTimeString())) {
			ampm.style.display = "inline";
			ampm.value = "AM";
		}
		updateUrl();
	}
	
	ampm.addEventListener('change', function (ev) {
		if (ev.target.value == "PM" && Number(hours.value) > 12) {
			timeMessage.innerHTML = "Hours should be an integer between 0 and 12";
			hours.value = "";
		}
		updateUrl();
	});

	commentary.onclick = updateUrl;
	
	document.getElementById("pushout").onclick = displayUnfilled;

	document.getElementById("reschedule").onclick = displayUnfilled;

	document.getElementById("remove").onclick = function() {
		if (user1.value && user2.value) {
			if (checkDuplicate()) {
				return;
			}
		}
		displayUnfilled();
	};
}

function displayUnfilled() {
	const fields = [user1, user2, date, hours];
	let unfilled = fields.filter(x => x.value == "").map(x => x.name);
	let unfilledCount = unfilled.length;
	if (unfilledCount > 0) {
		if (unfilledCount > 2) {
			unfilled[unfilledCount - 1] = "and " + unfilled[unfilledCount - 1];
			submitMessage.innerHTML = unfilled.join(", ") + " have not been filled."
		} else if (unfilledCount == 2) {
			submitMessage.innerHTML = unfilled.join(" and ") + " have not been filled."
		} else {
			submitMessage.innerHTML = unfilled[0] + " has not been filled."
		}
	}
}

function updateUrl() {
	let out = formURL;

	if (user1.value) {
		out += `&entry.665962030=${user1.value.replace(/ /g, "+")}`;
	}
	if (user2.value) {
		out += `&entry.933461438=${user2.value.replace(/ /g, "+")}`;
	}
	if (date.value && hours.value) {
		if (localTime.checked) {
			let ampmadj = String(Number(hours.value) + (hours.value == 12 ? (ampm.value == "AM" ? -12 : 0) : (ampm.value == "PM" ? 12 : 0)));
			out += `&entry.1930986713=${Intl.DateTimeFormat().resolvedOptions().timeZone}&entry.1984692058=${date.value}+${ampmadj.padStart(2, "0")}:${minutes.value.padStart(2, "0")}`;
		} else {
			out += `&entry.1984692058=${date.value}+${hours.value.padStart(2, "0")}:${minutes.value.padStart(2, "0")}`;
		}
	}
	
	if (override) {
		out += '&entry.894817070=__other_option__&entry.894817070.other_option_response=' + (division.value == 'A1' ? 'A' : division.value);
	}
	
	if ((division.value == 'A1') || (commentary.checked)) {
		out += '&entry.775049264=Yes';
	}

	const fields = [user1, user2, date, hours];
	let unfilled = fields.filter(x => x.value == "").map(x => x.name);
	let unfilledCount = unfilled.length;
	const duplicateEntry = checkDuplicate();
	const isDuplicateEntry = "day" in duplicateEntry;
	const duplicateText = isDuplicateEntry ? ` on ${duplicateEntry.day} at ${duplicateEntry.time} UTC` : "";
	for (let divid of ["pushout", "reschedule", "remove"]) {
		if (unfilledCount == 0) {
			refreshButton(divid, out, divid == "reschedule" ? duplicateText : (divid == "remove" ? " at Time Above" : ""));
		} else if (divid == "remove") {
			if (isDuplicateEntry && unfilled.includes("Date") && unfilled.includes("Hours")) {
				const now = new Date();
				const ty = new Date(`${now.getFullYear()}-${duplicateEntry.day.padStart(5, "0")}T${duplicateEntry.time.padStart(5, "0")}:00Z`);
				refreshButton(divid, out + `&entry.1984692058=${now.getFullYear() + (ty < now ? 1 : 0)}-${duplicateEntry.day.padStart(5, "0")}+${duplicateEntry.time.padStart(5, "0")}`, duplicateText);
			} else {
				refreshButton(divid, "", " at Time Above");
			}
		} else {
			refreshButton(divid, "", divid == "reschedule" ? duplicateText : "");
		}
	}
}

function refreshButton(divid, url, addon = "") {
	let outerdiv = document.getElementById(divid);
	outerdiv.innerHTML = "";
	let button = document.createElement("button");
	button.appendChild(document.createTextNode(buttonText[divid] + addon));
	if (url) {
		let buttonDiv = document.createElement("div");
		buttonDiv.appendChild(button);
		let buttonLink = document.createElement("a");
		buttonLink.target = "_blank";
		buttonLink.href = url + rrEntry[divid] +"&submit=Submit";
		buttonLink.appendChild(buttonDiv);
		outerdiv.appendChild(buttonLink);
	} else {
		outerdiv.appendChild(button);
	}
}

function checkDuplicate() {
	let found = false;
	if (user1.value && user2.value) {
		let divCal = divisions.calendar[division.value];
		if ((user1.value in divCal) && (user2.value in divCal[user1.value])) {
			found = true;
		}
	}
	if (found) {
		return divisions.calendar[division.value][user1.value][user2.value];
	} else {
		return {};
	}
}
	
function updatePlayers(division) {
	var members = override ? ((division in override) ? override[division] : []) : ((division in divisions) ? Object.keys(divisions[division].members) : []);
	members.sort((a,b) => a.localeCompare(b, 'en', {'sensitivity': 'base'}));
	user1.innerHTML = '<option value=""></option>';
	user2.innerHTML = '<option value=""></option>';
	for (player of members) {
		let opt1 = document.createElement("option");
		let opt2 = document.createElement("option");
		opt1.value = player;
		opt2.value = player;
		opt1.appendChild(document.createTextNode(player));
		opt2.appendChild(document.createTextNode(player));
		user1.appendChild(opt1);
		user2.appendChild(opt2);
	}
}

</script>
